<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ORBIT">
  <title>ORBIT</title>
  <!-- The mark: one atom, two orbits, one small companion. Copper is the
       brand's own colour — this file never reads a CSS variable, because it is
       also used as a favicon and as an <img>, where no stylesheet applies. -->
  <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#AD7048" stroke-width="2.6"
           transform="rotate(42 32 32)" />
  <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#AD7048" stroke-width="2.6"
           transform="rotate(-42 32 32)" />
  <circle cx="32" cy="32" r="4.6" fill="#AD7048" />
  <circle cx="53.7" cy="24.4" r="3.4" fill="#A2673F" />
</svg>
