<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}orbit{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='orbit-mark.svg') }}" />
<!-- Space Grotesk + Inter (product brief, Part 2). The system stacks behind
     them keep the app fully usable where fonts cannot be fetched — the layout
     never depends on the webfont arriving. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===========================================================
     orbit — home screen + coding-agent task view, in dark blue.
     Accent tokens match design/orbit_mockup.html exactly; keep them
     in sync with the visual system.
     =========================================================== */

  :root {
    /* Brand surfaces — warm charcoal, never blue-tinted. The product brief's
       identity pass (2026-10-15) retired the blue palette: blue kept bleeding
       into backgrounds and competing with the accent. */
    --bg: #141210;            /* Charcoal — main background */
    --bg-raised: #1B1916;     /* Raised charcoal — sidebar */
    --bg-sunken: #100E0C;     /* inset surfaces */
    --bg-card: #221F1B;       /* Card charcoal — inputs, cards, panels */
    --border: #383430;        /* Warm border grey */
    --border-soft: rgba(56, 52, 48, 0.55);  /* subtler separators */
    /* Text */
    --text: #F4F0EA;          /* Warm White — primary text, wordmark */
    --text-dim: #ACA69C;      /* Ash — secondary text */
    --text-faint: #ACA69C;    /* Ash — muted text (kept AA-readable) */
    /* Brand accent — copper / burnt amber, used sparingly and deliberately:
       primary CTAs, active states, the orbit mark, key status highlights.
       A mid-tone copper pairs with near-black text (--on-accent): at this
       luminance neither cream (~2.8:1) nor slightly-blackened copper passes
       AA with light text, so fills get dark ink. */
    --accent: #C87F3F;        /* Burnt amber — user bubble fill, primary buttons */
    --on-accent: #1B1208;     /* Near-black text on copper fills (AA) */
    --accent-bright: #E2A97A; /* Light copper — active labels, the orbit mark */
    --accent-dim: #7C5326;    /* Deep copper — borders, thinking-block edge */
    --accent-wash: rgba(200, 127, 63, 0.16); /* selected background */
    --accent-soft: rgba(200, 127, 63, 0.45); /* focus ring */
    /* Functional status colors — kept distinct from brand */
    --green: #78B88A;         /* Success */
    --amber: #E5B567;         /* Warning */
    --red: #E17D7D;           /* Error */
    --red-wash: rgba(225, 125, 125, 0.12);
    --radius: 16px;           /* standardized card/panel/bubble/modal radius */
    --radius-sm: 10px;
    /* Soft drop-shadow elevation instead of hard 1px borders. */
    --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.35);
    --shadow-pop: 0 10px 34px rgba(0, 0, 0, 0.5);
    /* Space Grotesk carries the wordmark, section headers and card titles;
       Inter carries everything else. Weight contrast is deliberate — nothing
       flattens to one weight. */
    --font-display: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; font-size: 14px; }
  .screen { display: none; height: 100vh; }
  .screen--active { display: flex; }

  /* ===================== shared: sidebar ===================== */
  .sidebar {
    width: 240px; flex-shrink: 0;
    background: var(--bg-raised); border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column; padding: 14px 10px;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; padding: 4px 6px 16px; font-weight: 600; letter-spacing: 0.01em; font-family: var(--font-display); }
  /* The wordmark and favicon share the same orbital SVG mark. */
  .brand-mark { display: block; width: 18px; height: 18px; flex-shrink: 0; }

  .new-convo {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent-wash); border: 1px solid var(--accent-dim);
    color: var(--accent-bright); border-radius: var(--radius-sm);
    padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
  }
  .new-convo:hover { border-color: var(--accent); }
  .sidebar-search {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-faint); font-size: 12px;
    padding: 7px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft); margin-bottom: 14px;
  }

  .history-group { margin-bottom: 14px; }
  .history-group h4 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); margin: 0 0 6px 8px; font-weight: 600;
  }
  .history-item {
    padding: 7px 8px; border-radius: var(--radius-sm);
    font-size: 12.5px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  .history-item:hover { background: var(--bg-sunken); color: var(--text); }
  .history-item.active { background: var(--accent-wash); color: var(--accent-bright); }

  .sidebar-spacer { flex: 1; }
  .sidebar-foot {
    border-top: 1px solid var(--border-soft); padding-top: 10px; margin-top: 6px;
  }
  .connected-apps-row {
    font-size: 11px; color: var(--text-faint); padding: 4px 8px 10px; display: flex; align-items: center; gap: 6px;
  }
  .connected-apps-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .user-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
  .user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-wash); border: 1px solid var(--accent-dim);
    color: var(--accent-bright); display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
  }
  .user-row .names { line-height: 1.3; }
  .user-row .name { font-size: 12.5px; color: var(--text); }
  .user-row .sub { font-size: 11px; color: var(--text-faint); }

  /* ===================== screen 1: home ===================== */
  .home-main { flex: 1; display: flex; flex-direction: column; }
  .home-topbar {
    display: flex; align-items: center; justify-content: center; position: relative;
    padding: 16px 20px; border-bottom: 1px solid var(--border-soft);
  }
  .mode-toggle {
    display: flex; background: var(--bg-sunken); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px;
  }
  .mode-toggle button {
    border: none; background: transparent; color: var(--text-faint);
    padding: 6px 16px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .mode-toggle button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .mode-toggle button.active:hover { filter: brightness(1.15); }
  .home-topbar-controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .thinking-toggle button { padding: 6px 10px; font-size: 11px; }
  .plus-badge {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--accent-bright); border: 1px solid var(--accent-dim);
    border-radius: 999px; padding: 3px 10px;
  }

  .home-center {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
  }

  /* ===================== welcome screen (empty conversation only) ===================== */
  /* Heading, subtitle and three shortcuts that send a real prompt. The orbit
     rings idle slowly here; while Orbit is responding the same mark spins fast
     beside the status line (#turnStatusBar). prefers-reduced-motion stops both
     (see the media query at the end of this file). */
  .welcome {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    margin-bottom: 22px; transition: opacity 160ms ease;
  }
  .welcome[hidden] { display: none; }
  .welcome-greeting { margin: 0 0 10px; color: var(--text-faint); font-size: 12px; letter-spacing: 0.02em; }
  .welcome-rings { width: 66px; height: 66px; margin-bottom: 14px; opacity: 0.92; }
  .welcome-rings img { display: block; width: 100%; height: 100%; }
  .rings-slow img { animation: orbit-ring-turn 20s linear infinite; }
  .rings-fast img { animation: orbit-ring-turn 1.6s linear infinite; }
  .welcome h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .welcome-sub { color: var(--text-faint); font-size: 13.5px; margin: 0; }
  /* Once Orbit starts responding the heading and shortcuts step aside and the
     same mark shrinks into the status line and turns fast. */
  .welcome.is-responding { width: 680px; max-width: 100%; align-items: flex-start; margin-bottom: 6px; }
  .welcome.is-responding .welcome-greeting,
  .welcome.is-responding h1,
  .welcome.is-responding .welcome-sub,
  .welcome.is-responding .welcome-actions { display: none; }
  .welcome.is-responding .welcome-rings { width: 26px; height: 26px; margin-bottom: 0; }
  .welcome.is-responding .welcome-rings img { animation: orbit-ring-turn 1.6s linear infinite; }
  .welcome-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .welcome-action {
    font: inherit; font-size: 12.5px; padding: 8px 15px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
  }
  .welcome-action:hover, .welcome-action:focus-visible {
    color: var(--text); border-color: rgba(200, 127, 63,0.45); background: var(--accent-wash);
  }

  /* The live status line: what the turn is actually doing, in words. */
  .turn-status-bar, .followup-chips { width: 680px; max-width: 100%; }
  .turn-status-bar { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .turn-status-bar[hidden] { display: none; }
  /* On the welcome screen the mark above carries the motion, so the bar's own
     pair steps out rather than showing two. */
  .turn-status-bar.no-rings .turn-rings { display: none; }
  .turn-rings { width: 24px; height: 24px; flex: 0 0 24px; opacity: 0.95; }
  .turn-rings img { display: block; width: 100%; height: 100%; }
  .turn-status-text { font-size: 12.5px; color: var(--text-dim); font-style: italic; }

  /* Follow-up chips above the composer. Rendered only when the last reply gives
     them something real to act on; hidden (not empty) otherwise. */
  .followup-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .followup-chips[hidden] { display: none; }
  .followup-chip {
    font: inherit; font-size: 11.5px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
  }
  .followup-chip:hover, .followup-chip:focus-visible {
    color: var(--text); border-color: rgba(200, 127, 63,0.42); background: rgba(200, 127, 63,0.055);
  }

  .home-composer {
    width: 560px; max-width: 100%;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
  }
  .home-composer:focus-within { border-color: var(--accent-dim); }
  .home-composer input {
    width: 100%; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 14px; margin-bottom: 10px;
  }
  .home-composer input::placeholder { color: var(--text-faint); }
  .composer-controls { display: flex; align-items: center; gap: 10px; }
  .model-select {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px;
    cursor: pointer;
  }
  .model-select .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .composer-controls .spacer { flex: 1; }
  .icon-btn-round {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg-sunken);
    color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .voice-control-group { display: flex; align-items: center; gap: 2px; }
  .voice-btn { flex-shrink: 0; font: inherit; padding: 0; touch-action: none; user-select: none; }
  .voice-btn.recording { border-color: var(--red); background: var(--red-wash); color: var(--red); }
  .voice-btn:disabled { opacity: 0.5; cursor: default; }
  .voice-expand-btn {
    width: 22px; height: 28px; padding: 0; border: 0; border-radius: 6px;
    background: transparent; color: var(--text-faint); font: inherit; font-size: 17px;
    line-height: 1; cursor: pointer; transition: color 140ms ease, background 140ms ease;
  }
  .voice-expand-btn:hover, .voice-expand-btn:focus-visible { color: var(--text); background: var(--bg-sunken); }
  .voice-expand-btn:disabled { opacity: 0.45; cursor: default; }
  .voice-feedback { color: var(--text-faint); font-size: 11px; line-height: 1.4; margin-top: 7px; }
  .voice-feedback.error { color: var(--red); }
  .voice-feedback[hidden] { display: none; }
  .voice-chat-view {
    position: fixed; inset: 0; z-index: 900; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
  }
  .voice-chat-view[hidden] { display: none !important; }
  .voice-view-topbar {
    flex: 0 0 auto; min-height: 58px; display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--border-soft);
  }
  .voice-view-back {
    justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px;
    border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-dim);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .voice-view-back:hover { border-color: var(--border); color: var(--text); background: var(--bg-card); }
  .voice-view-back span { font-size: 17px; line-height: 1; }
  .voice-view-title { color: var(--text-dim); font-size: 12px; letter-spacing: 0.03em; }
  .voice-view-topbar-spacer { justify-self: end; width: 1px; }
  .voice-view-main {
    flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 28px 20px 36px; text-align: center;
  }
  .voice-view-rings { width: clamp(132px, 22vh, 184px); height: clamp(132px, 22vh, 184px); margin-bottom: 24px; opacity: 0.96; }
  .voice-view-rings img { display: block; width: 100%; height: 100%; }
  .voice-view-rings[data-state="idle"] img { animation: orbit-ring-turn 20s linear infinite; }
  .voice-view-rings[data-state="listening"] img {
    animation: orbit-ring-turn 1.6s linear infinite;
    filter: drop-shadow(0 0 7px rgba(200, 127, 63,0.25));
  }
  .voice-view-rings[data-state="thinking"] img {
    animation: orbit-ring-turn 8s linear infinite;
    filter: drop-shadow(0 0 3px rgba(200,127,63,0.20));
  }
  .voice-view-rings[data-state="speaking"] img {
    animation: none; filter: drop-shadow(0 0 5px rgba(200,127,63,0.32));
  }
  .voice-view-state { min-height: 22px; margin: 0; color: var(--text); font-size: 16px; font-weight: 500; }
  .voice-view-state.error { color: #f1a0a0; }
  .voice-view-conversation { width: min(560px, 100%); margin-top: 20px; }
  .voice-view-transcript, .voice-view-reply { margin: 0 0 10px; line-height: 1.6; overflow-wrap: anywhere; }
  .voice-view-transcript { color: var(--text-faint); font-size: 13px; }
  .voice-view-reply { color: var(--text-dim); font-size: 14px; }
  .voice-view-reply::before {
    content: "orbit"; display: block; margin-bottom: 4px; color: var(--accent-bright);
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  }
  .voice-view-transcript[hidden], .voice-view-reply[hidden] { display: none; }
  .voice-view-mic { margin-top: 18px; }
  .voice-view-mic .voice-btn { width: 62px; height: 62px; font-size: 23px; }
  .voice-view-mic .voice-btn.recording { box-shadow: 0 0 0 8px var(--red-wash); }
  .voice-view-hint { margin: 13px 0 0; color: var(--text-faint); font-size: 11px; }
  .reply-audio { display: block; width: min(320px, 100%); height: 34px; margin-top: 6px; }
  .send-btn-round {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); border: none; color: var(--on-accent);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    /* The mockup drew this as a div; as a real <button> it must not inherit
       the browser's button font/padding, and it needs a visible focus ring. */
    font: inherit; padding: 0;
  }
  .send-btn-round:hover { filter: brightness(1.15); }
  .send-btn-round:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
  button:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }

  .connected-tools { text-align: center; margin-top: 40px; }
  .connected-tools .label { font-size: 11px; color: var(--text-faint); margin-bottom: 10px; }
  .tool-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .tool-pill {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim);
  }
  .tool-pill.connected { color: var(--text); }
  .tool-pill .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .tool-pill.connected .status-dot { background: var(--green); }
  .tool-pill.not-connected .status-dot { background: var(--text-faint); }
  .manage-link { color: var(--accent-bright); cursor: pointer; }

  .home-footer { text-align: center; padding: 16px; font-size: 11px; color: var(--text-faint); }

  /* Composer position. A fresh conversation centers it. The first send animates
     it (see app.js dockComposer) into a fixed bottom bar for the rest of that
     conversation. "+ New conversation" reloads a fresh, centered page. The bar's
     left edge is the sidebar width (240px), so it spans only the chat column. */
  .composer-dock { width: 100%; display: flex; justify-content: center; }
  .home-main.is-docked { min-height: 0; }
  .home-main.is-docked .composer-dock {
    position: fixed; left: 240px; right: 0; bottom: 0; z-index: 5;
    padding: 12px 20px 18px; background: var(--bg);
    border-top: 1px solid var(--border-soft);
  }
  .home-main.is-docked .connected-tools,
  .home-main.is-docked .home-footer { display: none; }
  .home-main.is-docked .home-center {
    justify-content: flex-start; min-height: 0; padding: 16px 20px 150px;
  }
  .home-main.is-docked .home-thread {
    flex: 1; min-height: 0; max-height: none; width: 560px; margin-bottom: 0;
  }

  /* ===================== screen 2: coding agent task ===================== */
  .task-main { flex: 1; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  .task-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--border-soft);
  }
  .task-topbar-left { display: flex; flex-direction: column; gap: 2px; }
  .task-breadcrumb { font-size: 11px; color: var(--text-faint); }
  .task-title-row { font-size: 15px; font-weight: 600; }
  .task-topbar-right { display: flex; align-items: center; gap: 10px; }
  .working-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent-bright); }
  .working-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .pause-btn {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--bg-sunken);
    color: var(--text-dim); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; cursor: pointer;
  }

  .task-status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 22px; border-bottom: 1px solid var(--border-soft);
    font-size: 11.5px; color: var(--text-faint); background: var(--bg-sunken);
  }
  .no-push-note { color: var(--accent-bright); }

  .task-body { display: grid; grid-template-columns: 1fr 320px; overflow: hidden; }
  .task-work { overflow-y: auto; padding: 22px; }
  .task-work-eyebrow { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 8px; }
  .task-work h2 { font-size: 20px; margin: 0 0 8px; }
  .task-work p.desc { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin: 0 0 20px; }

  /* ===================== Agent task panel ===================== */
  /* Rendered only when the task has run: steps planned from the request, files
     that were actually named, the live operation, and whatever needs approval.
     A task that has not run shows the request and a start control instead. */
  .task-work-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .new-task-btn {
    font: inherit; font-size: 11px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
  }
  .new-task-btn:hover, .new-task-btn:focus-visible { color: var(--text); border-color: var(--accent-dim); background: rgba(200, 127, 63,0.06); }

  .task-start { margin-bottom: 20px; }
  .task-start[hidden] { display: none; }
  .task-start-note { color: var(--text-faint); font-size: 12px; line-height: 1.5; margin: 0 0 12px; max-width: 560px; }
  .task-start-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .task-start-input {
    width: 100%; max-width: 560px; display: block; resize: vertical;
    background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font: inherit; font-size: 12.5px; line-height: 1.5; padding: 10px 12px;
  }
  .task-start-input:focus { outline: none; border-color: var(--accent-dim); }
  .task-start-actions { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
  .start-task-btn {
    font: inherit; font-size: 12px; font-weight: 600; padding: 7px 15px; border-radius: var(--radius-sm);
    border: none; background: var(--accent); color: var(--on-accent); cursor: pointer;
  }
  .start-task-btn:hover:not(:disabled) { filter: brightness(1.15); }
  .start-task-btn:disabled { opacity: 0.6; cursor: default; }
  .task-start-cancel {
    font: inherit; font-size: 12px; padding: 7px 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer;
  }
  .task-start-cancel:hover { color: var(--text); border-color: var(--accent-dim); }
  .task-start-error { font-size: 11.5px; color: var(--red); }
  .task-start-error:empty { display: none; }

  .task-panel {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
  }
  .task-panel[hidden] { display: none; }
  .panel-section { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
  .panel-section:last-child { border-bottom: 0; }
  .panel-section h3 {
    margin: 0 0 9px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.09em;
    text-transform: uppercase; color: #858995;
  }
  .panel-note { margin: 9px 0 0; font-size: 10.5px; line-height: 1.45; color: var(--text-faint); }
  .panel-note[hidden] { display: none; }

  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .checklist-step { display: flex; align-items: flex-start; gap: 8px; }
  .check-icon { flex: 0 0 13px; font-size: 11px; line-height: 1.5; color: var(--text-faint); }
  .checklist-step.active .check-icon { color: var(--accent-bright); }
  .checklist-step.done .check-icon { color: var(--green); }
  .check-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .check-title { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.35; }
  .checklist-step.pending .check-title { font-weight: 500; color: var(--text-dim); }
  .checklist-step.done .check-title { font-weight: 500; color: var(--text-dim); }
  .check-detail { font-size: 11px; line-height: 1.45; color: var(--text-faint); }
  .checklist-step.active .check-detail { color: var(--text-dim); }

  .file-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .file-chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-family: ui-monospace, monospace; font-size: 11px;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-sunken); color: var(--text);
  }
  .file-chip em { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-style: normal; font-size: 10px; color: var(--text-faint); }

  .operation { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text); line-height: 1.45; }
  .operation .dot { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--accent); }
  .operation.is-running .dot { animation: pulse 1.3s ease-in-out infinite; }
  .operation.is-idle .dot { background: var(--text-faint); }
  .operation.is-failed .dot { background: var(--red); }
  .approval-state-line { margin: 8px 0 0; font-size: 11.5px; color: var(--text-dim); }
  .approval-note { display: flex; align-items: center; gap: 8px; padding: 0; font-size: 11.5px; color: var(--text-faint); background: transparent; }

  .activity-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 0 0 10px; display: flex; justify-content: space-between; }
  .activity-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); padding: 6px 0; border-bottom: 1px solid var(--border-soft); }
  .activity-row .time { color: var(--text-faint); }

  .task-chat {
    border-left: 1px solid var(--border-soft);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .task-chat-head { padding: 14px 16px; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; font-weight: 600; }
  .task-chat-log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

  /* Scrollable panels: the scrollbar is hidden, scrolling is not. Overflow stays
     auto (never hidden), so wheel, trackpad, touch and keyboard scrolling all
     still work. Covers the live activity list (inside .task-work), the side
     chat, and the home thread. */
  .task-work, .task-chat-log, .home-thread, .activity-section {
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* legacy Edge / IE */
  }
  .task-work::-webkit-scrollbar, .task-chat-log::-webkit-scrollbar, .home-thread::-webkit-scrollbar,
  .activity-section::-webkit-scrollbar {
    display: none;              /* Chromium / Safari */
  }
  /* Speakers are told apart by position and marker, not by a name label.
     User = right-aligned accent bubble. Orbit = plain left-aligned text with
     the orbital mark in front. Each row keeps its faint time line beneath. */
  .chat-row { display: flex; flex-direction: column; max-width: 86%; }
  .chat-row.user { align-self: flex-end; align-items: flex-end; }
  .chat-row.orbit { align-self: flex-start; align-items: flex-start; width: 100%; max-width: 100%; }
  .chat-bubble {
    font-size: 12.5px; max-width: 100%;
    padding: 9px 12px; border-radius: var(--radius);
    display: flex; flex-direction: column;
  }
  .chat-bubble.user {
    background: var(--accent); color: var(--on-accent);
    border-bottom-right-radius: 3px;
  }
  .chat-bubble.orbit {
    width: 100%; background: transparent; border: 0; border-radius: 0; padding: 0;
  }
  .chat-bubble .body { color: var(--text); line-height: 1.5; }
  .chat-bubble.orbit .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .chat-bubble.user .body { color: var(--text); }
  .chat-meta { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; padding: 0 2px; }
  .task-turn-status { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; background: var(--bg-card); }
  .task-turn-status[hidden] { display: none; }
  .task-turn-status .turn-rings { width: 18px; height: 18px; flex: 0 0 18px; }
  .task-chat-input { border-top: 1px solid var(--border-soft); padding: 10px 12px; display: flex; gap: 8px; align-items: center; background: var(--bg-card); }
  .task-chat-input input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font-size: 12.5px; }
  .task-chat-input input::placeholder { color: var(--text-faint); }
  .task-chat-input .voice-btn { width: 26px; height: 26px; }
  .task-chat .voice-feedback { padding: 0 12px 6px; margin-top: 0; background: var(--bg-card); }

  /* ===================== orbital mark + streaming thought/reply ===================== */
  .orbit-icon {
    width: 15px; height: 15px; flex-shrink: 0;
    display: inline-block; vertical-align: -3px; margin-right: 5px;
  }

  .thinking-block {
    display: flex; align-items: flex-start; gap: 0;
    font-size: 12px; font-style: italic; color: var(--text-faint);
    line-height: 1.6; margin-bottom: 14px; padding: 10px 12px;
    background: var(--bg-sunken); border-radius: var(--radius-sm);
    border-left: 2px solid var(--accent-dim);
  }
  /* Agent mode only: names the model whose answer this narration belongs to. */
  .thinking-label {
    font-style: normal; font-size: 11px; color: var(--accent-bright);
    white-space: nowrap; margin-right: 8px;
  }
  .thinking-label[hidden] { display: none; }
  .thinking-block .thinking-text::after {
    content: "▍"; color: var(--accent); animation: caret-blink 0.9s step-end infinite;
  }
  .thinking-block.done .thinking-text::after { content: ""; }
  @keyframes caret-blink { 50% { opacity: 0; } }

  .chat-bubble.orbit .body .orbit-icon { margin-right: 6px; }
  .chat-bubble .body.streaming::after {
    content: "▍"; color: var(--accent); animation: caret-blink 0.9s step-end infinite;
  }

  /* home chat thread (revealed after the first message) */
  .home-thread {
    width: 560px; max-width: 100%;
    display: none; flex-direction: column; gap: 14px;
    margin-bottom: 14px; max-height: 40vh; overflow-y: auto;
  }
  .home-thread.visible { display: flex; }

  /* failure and empty-turn lines — an unanswered turn must never look idle */
  .chat-bubble .notice, .home-thread > .notice {
    font-size: 11.5px; line-height: 1.45; color: var(--text-dim);
    font-style: italic;
  }
  .chat-bubble .notice.error, .home-thread > .notice.error {
    color: var(--red); font-style: normal;
  }
  .chat-bubble .notice.warn { color: var(--amber); font-style: normal; }

  /* ===================== reminders (heartbeat) ===================== */
  /* Notice cards sit above the thread. Each one is dismissed by hand, and
     a dismissal is audited. Quiet hours hold notices back; they never hide one
     already on screen. */
  .heartbeat-notices { width: 560px; max-width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .heartbeat-notices[hidden] { display: none; }
  .heartbeat-card {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--accent-dim);
    border-left: 3px solid var(--accent-bright); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 12.5px; color: var(--text);
  }
  .heartbeat-card .heartbeat-text { flex: 1; line-height: 1.45; }
  .heartbeat-dismiss {
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg-sunken);
    color: var(--text-dim); font-size: 11px; line-height: 1; cursor: pointer;
  }
  .heartbeat-dismiss:hover { color: var(--text); border-color: var(--accent-dim); }
  .heartbeat-dismiss:disabled { opacity: 0.5; cursor: default; }
  .heartbeat-dismiss:focus-visible, .reminders-toggle:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  /* Reminders switch in the sidebar foot. Switch on = reminders running. */
  .reminders-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px 10px; }
  .reminders-row .names { flex: 1; min-width: 0; line-height: 1.3; }
  .reminders-row .name { font-size: 12.5px; color: var(--text); }
  .reminders-row .sub { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reminders-row .sub.warn { color: var(--amber); white-space: normal; }
  .reminders-toggle {
    position: relative; width: 34px; height: 20px; flex-shrink: 0; padding: 0;
    border-radius: 999px; border: 1px solid var(--border); background: var(--bg-sunken); cursor: pointer;
  }
  .reminders-toggle .knob {
    position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-faint); transition: left 0.15s;
  }
  .reminders-toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .reminders-toggle[aria-checked="true"] .knob { left: 16px; background: var(--text); }
  .reminders-toggle:disabled { opacity: 0.5; cursor: default; }

  /* ===================== proposed tool actions (Chat mode) ===================== */
  /* A card sits in an Orbit bubble. Nothing runs until Approve; the card then
     shows the final state and what the tool reported. */
  .action-card { display: flex; flex-direction: column; gap: 0; }
  .action-label {
    display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent-bright); margin-bottom: 4px;
  }
  .action-summary { display: block; color: var(--text); line-height: 1.5; }
  .action-buttons { display: flex; gap: 8px; margin-top: 10px; }
  .action-buttons button {
    font: inherit; font-size: 12px; padding: 5px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-sunken); color: var(--text-dim);
  }
  .action-buttons button:hover { color: var(--text); border-color: var(--accent-dim); }
  .action-buttons button:disabled { opacity: 0.5; cursor: default; }
  .action-buttons .action-approve { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .action-buttons button:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  .action-result { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .action-card[data-state="approved"] .action-result { color: var(--green); }
  .action-card[data-state="failed"] .action-result,
  .action-card[data-state="expired"] .action-result { color: var(--amber); }
  /* ===================== deliberate UI polish ===================== */
  .sidebar { width: 240px; padding: 12px 9px; }
  .new-convo {
    justify-content: flex-start; gap: 8px; min-height: 36px; padding: 7px 10px;
    color: var(--text-dim); background: transparent; border-color: var(--border);
    font-size: 12.5px; box-shadow: none; transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
  }
  .new-convo-plus { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; font-size: 17px; line-height: 1; font-weight: 400; }
  .new-convo:hover, .new-convo:focus-visible { color: var(--text); border-color: var(--accent-bright); background: rgba(200, 127, 63, 0.07); }
  .sidebar-search { gap: 7px; padding: 5px 9px; margin-bottom: 12px; font-size: 12px; background: var(--bg-sunken); }
  .sidebar-search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 11.5px; }
  .sidebar-search input::placeholder { color: var(--text-faint); }
  .history-group { margin-bottom: 10px; }
  .history-group h4 { font-size: 9px; letter-spacing: 0.09em; color: #858995; margin-bottom: 4px; }
  .history-item { padding: 6px 9px; font-size: 11.75px; transition: background 150ms ease, color 150ms ease; }
  .history-item.active { padding-left: 7px; background: rgba(244, 240, 234, 0.045); color: var(--text); border-left: 2px solid rgba(200, 127, 63, 0.75); }
  .sidebar-foot { padding-top: 8px; margin-top: 4px; }
  .connected-apps-row { padding: 3px 8px 6px; font-size: 10.5px; }
  .user-row { padding: 6px 7px 2px; gap: 7px; }
  .user-row .name { font-size: 11.5px; }
  .user-row .sub { font-size: 10px; }
  .utility-settings { width: 28px; height: 28px; flex: 0 0 28px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text-faint); font: inherit; cursor: pointer; }
  .utility-settings:hover { border-color: var(--border); color: var(--text); background: rgba(255,255,255,0.03); }

  /* ===================== sidebar: collapsed =====================
     A narrow rail of icons. Every control keeps its hover tooltip and its
     accessible name; only the visible text goes. The state is written to
     localStorage by app.js and applied before paint by the inline script in
     <head>, so a collapsed sidebar never flashes open on reload. */
  .sidebar { transition: width 160ms ease; }
  .sidebar-toggle {
    width: 24px; height: 24px; flex: 0 0 24px; margin-left: auto; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: 7px; background: transparent;
    color: var(--text-faint); font: inherit; font-size: 12px; line-height: 1; cursor: pointer;
  }
  .sidebar-toggle:hover, .sidebar-toggle:focus-visible { border-color: var(--border); color: var(--text); background: rgba(255,255,255,0.03); }
  .sidebar-head { display: flex; align-items: center; gap: 8px; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
  .sidebar-nav-item, .sidebar-icon-item {
    display: flex; align-items: center; gap: 9px; min-height: 30px; padding: 6px 9px;
    border: 0; border-radius: var(--radius-sm); background: transparent;
    color: var(--text-dim); font: inherit; font-size: 12.5px; text-align: left;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .sidebar-nav-item:hover, .sidebar-icon-item:hover { background: var(--bg-sunken); color: var(--text); }
  .sidebar-nav-item.active { background: rgba(244, 240, 234, 0.045); color: var(--text); }
  .sidebar-nav-icon { width: 16px; flex: 0 0 16px; text-align: center; font-size: 13px; }
  .history-icon {
    width: 16px; flex: 0 0 16px; text-align: center;
    font-size: 10px; font-weight: 600; color: var(--text-faint);
  }
  .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

  .sidebar--collapsed { width: 58px; padding: 12px 7px; }
  .sidebar--collapsed .sidebar-label,
  .sidebar--collapsed .sidebar-search input,
  .sidebar--collapsed .history-group h4,
  .sidebar--collapsed .connected-apps-row .label-text,
  .sidebar--collapsed .user-row .names { display: none; }
  .sidebar--collapsed .new-convo,
  .sidebar--collapsed .sidebar-search,
  .sidebar--collapsed .history-item,
  .sidebar--collapsed .sidebar-nav-item,
  .sidebar--collapsed .reminders-row { justify-content: center; padding-left: 0; padding-right: 0; }
  .sidebar--collapsed .sidebar-search,
  .sidebar--collapsed .new-convo { gap: 0; }
  .sidebar--collapsed .history-item { border-left: 0 !important; }
  .sidebar--collapsed .history-item.active { background: var(--accent-wash); }
  .sidebar--collapsed .connected-apps-row { justify-content: center; padding-left: 0; padding-right: 0; }
  .sidebar--collapsed .user-row { flex-direction: column; gap: 6px; padding: 6px 0 2px; }
  .sidebar--collapsed .reminders-row { gap: 0; }
  .sidebar--collapsed .sidebar-brand .brand-word { display: none; }
  .sidebar--collapsed .sidebar-toggle { margin: 0 auto; }

  /* ===================== analytics view ===================== */
  .analytics-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .analytics-body { flex: 1; overflow-y: auto; padding: 22px clamp(16px, 4vw, 40px) 40px; }
  .analytics-inner { max-width: 860px; margin: 0 auto; }
  .analytics-summary { margin: 0 0 6px; font-size: 19px; font-weight: 600; color: var(--text); }
  .analytics-sub { margin: 0 0 22px; color: var(--text-faint); font-size: 12.5px; line-height: 1.5; }
  .analytics-note {
    margin: 0 0 18px; padding: 10px 12px; border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); background: rgba(255,255,255,0.02);
    color: var(--text-dim); font-size: 12px; line-height: 1.5;
  }
  .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .analytics-card { border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--bg-card); padding: 14px 15px; }
  .analytics-card h3 { margin: 0 0 12px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); font-weight: 600; }
  .analytics-big { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1.1; }
  .analytics-figure-note { margin-top: 4px; color: var(--text-faint); font-size: 11.5px; }
  .analytics-days { display: flex; flex-direction: column; gap: 7px; }
  .analytics-day { display: grid; grid-template-columns: 66px 1fr 34px; align-items: center; gap: 10px; font-size: 12px; }
  .analytics-day .label { color: var(--text-dim); }
  .analytics-day .count { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .analytics-bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .analytics-bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent-bright); opacity: 0.75; }
  .analytics-day.is-today .label { color: var(--text); }
  .analytics-rows { display: flex; flex-direction: column; gap: 8px; }
  .analytics-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12.5px; }
  .analytics-row .value { color: var(--text); font-variant-numeric: tabular-nums; }
  .analytics-row .key { color: var(--text-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .analytics-row .model-id { color: var(--text-faint); font-size: 11px; }
  .analytics-empty { color: var(--text-faint); font-size: 12.5px; }

  .app-topbar {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center; gap: 14px; min-height: 62px; padding: 9px 18px;
  }
  .topbar-title { display: flex; min-width: 0; flex-direction: column; justify-self: start; gap: 3px; }
  .topbar-eyebrow { overflow: hidden; max-width: 100%; color: var(--text-faint); font-size: 9px; line-height: 1.2; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; text-overflow: ellipsis; }
  .topbar-name { overflow: hidden; max-width: 100%; color: var(--text); font-size: 13px; font-weight: 550; line-height: 1.35; white-space: nowrap; text-overflow: ellipsis; }
  .topbar-controls { display: flex; justify-self: center; align-items: center; gap: 8px; }
  .mode-toggle { background: var(--bg-sunken); border-color: rgba(120, 128, 145, 0.22); padding: 2px; }
  .mode-toggle button { padding: 5px 12px; color: #9296a1; font-size: 11.5px; transition: color 180ms ease, background-color 180ms ease, box-shadow 180ms ease; }
  .mode-toggle button.active { color: var(--text); background: #252b36; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.035); }
  .mode-toggle button.active:hover { filter: none; background: #2b323f; }
  .mode-toggle button:disabled { opacity: 0.55; cursor: wait; }
  .thinking-toggle button { padding: 5px 9px; font-size: 10.5px; }
  .topbar-actions { display: flex; justify-self: end; align-items: center; gap: 9px; min-width: 0; }
  .topbar-icon-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-dim); font: inherit; cursor: pointer; transition: border-color 150ms ease, color 150ms ease, background 150ms ease; }
  .topbar-icon-button:hover { color: var(--text); border-color: var(--border); background: rgba(255,255,255,0.035); }
  .topbar-account { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--text-dim); font: inherit; font-size: 11px; cursor: pointer; }
  .topbar-avatar { display: inline-flex; width: 26px; height: 26px; flex: 0 0 26px; align-items: center; justify-content: center; border: 1px solid rgba(200, 127, 63,0.24); border-radius: 50%; background: rgba(200, 127, 63,0.1); color: var(--accent-bright); font-size: 9px; font-weight: 700; }
  .topbar-account-name { max-width: 100px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .task-topbar-actions { gap: 7px; }
  .task-topbar-actions .working-indicator { white-space: nowrap; font-size: 10.5px; }
  .task-topbar-actions .pause-btn { padding: 5px 8px; font-size: 10.5px; }

  .welcome { margin-bottom: 20px; }
  .welcome-rings { width: 58px; height: 58px; margin-bottom: 12px; }
  .welcome h1 { font-size: 25px; }
  .welcome-sub { font-size: 12.5px; }
  .welcome-actions { margin-top: 14px; gap: 7px; }
  .welcome-action { padding: 7px 13px; font-size: 12px; }
  .home-composer { width: 680px; padding: 12px 14px; box-shadow: 0 12px 35px rgba(0,0,0,0.12); }
  .home-composer input { margin-bottom: 9px; }
  .composer-controls { gap: 8px; }
  .composer-left-tools { display: flex; align-items: center; gap: 6px; }
  .composer-tool { display: inline-flex; align-items: center; justify-content: center; min-height: 27px; padding: 4px 8px; border: 1px solid transparent; border-radius: 7px; color: var(--text-faint); background: transparent; font: inherit; font-size: 11px; text-decoration: none; cursor: pointer; transition: color 150ms ease, background 150ms ease, border-color 150ms ease; }
  .composer-tool:hover, .composer-tool:focus-visible { color: var(--text); border-color: var(--border); background: rgba(255,255,255,0.035); }
  .attach-tool { width: 28px; padding: 0; font-size: 19px; font-weight: 300; }
  .github-shortcut { gap: 6px; border-color: var(--border-soft); }
  .github-shortcut > :first-child { color: var(--green); font-size: 8px; }
  .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
  .attachment-note { margin-top: 7px; color: var(--text-faint); font-size: 10.5px; line-height: 1.4; }
  .attachment-note[hidden] { display: none; }
  .connected-tools { margin-top: 27px; }
  .home-thread, .heartbeat-notices { width: 680px; max-width: 100%; }
  .home-main.is-docked .home-thread { width: 680px; }
  .home-main.is-docked .home-composer { width: min(680px, 100%); }
  .home-main.is-docked .home-center { padding-bottom: 135px; }

  .task-body { grid-template-columns: minmax(0, 1fr) 360px; }
  .task-chat-log { padding: 14px 18px; }
  .task-chat-input { gap: 5px; }
  .task-chat-input input { font-size: 11.5px; }
  .task-attach, .task-github-shortcut { width: 23px; height: 25px; flex: 0 0 23px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text-faint); font: inherit; font-size: 16px; text-decoration: none; cursor: pointer; }
  .task-attach:hover, .task-github-shortcut:hover { color: var(--text); border-color: var(--border); }
  .task-chat .attachment-note { padding: 0 12px 7px; background: var(--bg-card); }

  .chat-row.orbit { position: relative; }
  .chat-bubble.orbit { position: relative; }
  /* Response actions: always visible, deliberately quiet. They sit below the
     text at low opacity so they are reachable on a touch screen without
     hovering (which a phone cannot do), and lift to full contrast only when
     pointed at or focused. They never compete with the message itself. */
  .message-actions { display: flex; align-items: center; gap: 2px; margin: 3px 0 0 20px; opacity: 0.55; transition: opacity 140ms ease; }
  .message-actions:hover, .message-actions:focus-within { opacity: 1; }
  .chat-row.orbit:hover .message-actions, .chat-row.orbit:focus-within .message-actions { opacity: 1; }
  .message-action { display: inline-flex; width: 24px; height: 22px; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text-faint); font: inherit; font-size: 11px; line-height: 1; cursor: pointer; transition: color 120ms ease, border-color 120ms ease, background 120ms ease; }
  .message-action:hover, .message-action:focus-visible { border-color: var(--border); background: var(--bg-card); color: var(--text); }
  .message-action[aria-pressed="true"] { color: var(--accent-bright); border-color: rgba(200, 127, 63,0.3); background: rgba(200, 127, 63,0.08); }
  .message-action:disabled { opacity: 0.38; cursor: default; }
  .message-action[data-message-action="feedback-up"][aria-pressed="true"] { color: var(--green); border-color: rgba(120,184,138,0.35); background: rgba(120,184,138,0.10); }
  .message-action[data-message-action="feedback-down"][aria-pressed="true"] { color: var(--red); border-color: rgba(225,125,125,0.35); background: rgba(225,125,125,0.10); }
  .chat-bubble.orbit .thinking-block { margin: 0 0 5px; padding: 0; border: 0; border-radius: 0; background: transparent; }
  .chat-bubble .notice.error, .home-thread > .notice.error {
    display: block; width: fit-content; max-width: 100%; margin-top: 7px; padding: 0;
    border: 0; border-radius: 0; background: transparent; color: #f1a0a0;
    font-size: 11.5px; font-style: normal;
  }
  .chat-bubble .notice.error::before, .home-thread > .notice.error::before { content: "⚠"; margin-right: 6px; color: var(--red); }
  .chat-row.orbit.is-generating .orbit-icon, .thinking-block:not(.done) .orbit-icon { animation: orbit-ring-turn 8s linear infinite; }
  .chat-row.orbit.is-generating .orbit-icon { filter: drop-shadow(0 0 3px rgba(200,127,63,0.20)); }
  .chat-row.orbit.is-streaming .orbit-icon { animation: none; filter: drop-shadow(0 0 5px rgba(200,127,63,0.32)); }
  @keyframes orbit-ring-turn { to { transform: rotate(360deg); } }
  .send-btn-round.is-stop { width: 32px; height: 32px; border-radius: 10px; background: #2b1d22; border: 1px solid rgba(225,125,125,0.32); color: #f0b2b2; font-size: 11px; }
  .send-btn-round.is-stop:hover { background: #39242a; filter: none; }
  .send-btn-round:disabled { opacity: 0.5; cursor: default; }
  .settings-dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--border); border-radius: 14px; background: #171c26; color: var(--text); box-shadow: 0 24px 80px rgba(0,0,0,0.55); }
  .settings-dialog::backdrop { background: rgba(5,8,14,0.72); backdrop-filter: blur(3px); }
  .settings-dialog form { padding: 20px; }
  .settings-dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border-soft); }
  .settings-dialog-head h2 { margin: 5px 0 0; font-size: 16px; font-weight: 600; }
  .settings-dialog-close { width: 28px; height: 28px; border: 1px solid var(--border-soft); border-radius: 8px; background: transparent; color: var(--text-dim); font: inherit; font-size: 18px; cursor: pointer; }
  .settings-dialog-details { display: grid; gap: 12px; padding: 16px 0 12px; }
  .settings-dialog-details > div { display: flex; justify-content: space-between; gap: 14px; color: var(--text-faint); font-size: 12px; }
  .settings-dialog-details strong { color: var(--text); font-weight: 500; text-align: right; }
  .settings-dialog-note { margin: 4px 0 0; padding: 10px 11px; border-radius: 8px; background: rgba(255,255,255,0.035); color: var(--text-dim); font-size: 11px; line-height: 1.5; }
  .task-chat-input .send-btn-round { width: 28px; height: 28px; flex: 0 0 28px; }
  .task-chat-input .send-btn-round.is-stop { width: 28px; height: 28px; }

  @media (hover: none) {
    /* Touch: the row actions are always at full contrast, since there is no
       hover to reveal them with. */
    .message-actions { opacity: 1; }
  }
  @media (max-width: 1100px) {
    .topbar-actions .topbar-account-name { display: none; }
    .task-topbar-actions .working-indicator > span:last-child { display: none; }
    .task-topbar-actions .pause-btn { display: none; }
    .task-body { grid-template-columns: minmax(0, 1fr) 330px; }
  }
  @media (max-width: 820px) {
    .sidebar { width: 205px; }
    .app-topbar { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; row-gap: 8px; }
    .topbar-title { grid-column: 1; grid-row: 1; }
    .topbar-actions { grid-column: 2; grid-row: 1; }
    .topbar-controls { grid-column: 1 / -1; grid-row: 2; }
    .task-body { grid-template-columns: minmax(0, 1fr) 300px; }
    .home-main.is-docked .composer-dock { left: 205px; }
  }
  @media (max-width: 640px) {
    body { height: 100dvh; }
    .sidebar { display: none; }
    .screen { height: 100dvh; }
    .app-topbar { padding: 8px 12px; }
    .home-main.is-docked .composer-dock { left: 0; padding: 9px 12px 12px; }
    .home-main.is-docked .home-center { padding: 12px 12px 124px; }
    .home-center { padding: 14px 12px; }
    .home-composer { padding: 10px 11px; }
    .task-topbar-actions { gap: 2px; }
    .task-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(230px, 1fr) 280px; }
    .task-chat { border-left: 0; border-top: 1px solid var(--border-soft); }
    .task-work { padding: 15px; }
    .task-work-head { flex-wrap: wrap; gap: 8px; }
    .task-status-bar { gap: 10px; padding: 7px 12px; font-size: 10px; }
  }
  /* =====================================================================
     ORBIT Projects — the product IA from the 2026-10-15 brief. These pages
     set the visual standard the older screens migrate to: 16px radii, soft
     shadow elevation, one outline icon set (1.5px stroke, round caps),
       Space Grotesk display type over Inter.
       ===================================================================== */
  .page-main {
    flex: 1; min-width: 0; overflow-y: auto;
    padding: 34px 40px 60px;
  }
  .page-wrap { max-width: 1060px; margin: 0 auto; }
  .page-eyebrow {
    margin: 0 0 6px; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent-bright); font-weight: 600;
  }
  .page-title { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .page-sub { margin: 7px 0 0; color: var(--text-faint); font-size: 13.5px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .page-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--on-accent); border: none; border-radius: var(--radius);
    padding: 10px 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary svg { width: 15px; height: 15px; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 7px; background: transparent;
    border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius);
    padding: 10px 14px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent-dim); }

  /* Toolbar: search + the brief's four-bucket status filter. */
  .projects-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .search-field {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; max-width: 340px;
    background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 9px 13px; color: var(--text-faint);
  }
  .search-field:focus-within { border-color: var(--accent-dim); }
  .search-field svg { width: 15px; height: 15px; flex-shrink: 0; }
  .search-field input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 13px;
  }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
    color: var(--text-dim); border: 1px solid var(--border-soft); background: transparent;
  }
  .filter-chip:hover { color: var(--text); border-color: var(--border); }
  .filter-chip.active { background: var(--accent-wash); border-color: var(--accent-dim); color: var(--accent-bright); }
  .filter-chip .count { font-size: 11px; opacity: 0.75; }

  .notice-bar {
    display: flex; align-items: flex-start; gap: 9px; margin-bottom: 18px;
    background: var(--accent-wash); border: 1px solid var(--accent-dim); border-radius: var(--radius);
    color: var(--accent-bright); padding: 11px 14px; font-size: 13px; line-height: 1.5;
  }
  .notice-bar svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  /* The creation panel — a details element so it works without JS; the
     server re-renders it open when a submission needs an answer. */
  .create-panel {
    margin-bottom: 24px; background: var(--bg-card); border-radius: var(--radius);
    box-shadow: var(--shadow-card); overflow: hidden;
  }
  .create-panel > summary {
    list-style: none; cursor: pointer; padding: 14px 18px;
    display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px;
    color: var(--text);
  }
  .create-panel > summary::-webkit-details-marker { display: none; }
  .create-panel > summary svg { width: 15px; height: 15px; transition: transform 0.15s ease; }
  .create-panel[open] > summary svg { transform: rotate(45deg); }
  .create-panel > summary .summary-hint { font-weight: 400; color: var(--text-faint); font-size: 12px; margin-left: auto; }
  .create-body { padding: 4px 18px 18px; border-top: 1px solid var(--border-soft); }
  .create-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 14px; }
  @media (max-width: 720px) { .create-grid { grid-template-columns: 1fr; } }
  .field-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-dim); }
  .field-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; line-height: 1.5; }
  .text-input, .text-area {
    width: 100%; background: var(--bg-sunken); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); color: var(--text); font: inherit; font-size: 13px;
    padding: 9px 12px; outline: none;
  }
  .text-area { resize: vertical; min-height: 74px; }
  .text-input:focus, .text-area:focus { border-color: var(--accent-dim); }
  .source-list { display: flex; flex-direction: column; gap: 7px; }
  .source-option {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm); cursor: pointer;
  }
  .source-option:hover { border-color: var(--border); }
  .source-option input { accent-color: var(--accent); margin: 0; }
  .source-option svg { width: 16px; height: 16px; color: var(--text-dim); flex-shrink: 0; }
  .source-option .source-name { font-size: 13px; font-weight: 500; }
  .source-option .source-note { font-size: 11.5px; color: var(--text-faint); }
  .source-option .source-badge {
    margin-left: auto; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-faint);
    white-space: nowrap;
  }
  /* Unconnected entry points are visible and discoverable — just not
     selectable. Nothing pretends to import. */
  .source-option.disabled { opacity: 0.55; cursor: not-allowed; }
  .source-option.disabled:hover { border-color: var(--border-soft); }
  .source-option .source-badge.available { color: var(--green); border-color: var(--green); }
  .create-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; }

  /* Project cards: the three-tier hierarchy from the brief — bold primary
     label, muted secondary line, status set apart. */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .project-card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--bg-card); border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow-card);
  }
  .pc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-badge.st-live { color: var(--green); border-color: var(--green); }
  .status-badge.st-building { color: var(--accent-bright); border-color: var(--accent-dim); }
  .status-badge.st-archived { color: var(--text-faint); }
  .status-badge.st-idea { color: var(--amber); border-color: var(--amber); }
  .pc-source { font-size: 11px; color: var(--text-faint); }
  .pc-name { margin: 0; font-family: var(--font-display); font-size: 16.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .pc-desc { margin: 0; color: var(--text-dim); font-size: 13px; line-height: 1.55; flex: 1; overflow-wrap: anywhere; }
  .pc-desc.empty { color: var(--text-faint); font-style: italic; }
  .pc-langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .pc-lang { font-size: 11px; color: var(--text-dim); border: 1px solid var(--border-soft); border-radius: 999px; padding: 3px 9px; }
  .pc-footer { display: flex; align-items: center; justify-content: space-between; color: var(--text-faint); font-size: 11.5px; border-top: 1px solid var(--border-soft); padding-top: 11px; }
  .pc-footer .pc-open { color: var(--accent-bright); text-decoration: none; }
  .pc-footer .pc-open:hover { text-decoration: underline; }
  .pc-name a { color: inherit; text-decoration: none; }
  .pc-name a:hover { color: var(--accent-bright); }

  /* Empty states: a real path forward, not a dead grid (brief §7). */
  .empty-state {
    text-align: center; padding: 60px 30px; background: var(--bg-card);
    border-radius: var(--radius); box-shadow: var(--shadow-card);
  }
  .empty-state .empty-mark { width: 54px; height: 54px; margin-bottom: 16px; opacity: 0.9; }
  .empty-state h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .empty-state p { margin: 0 auto 18px; max-width: 460px; color: var(--text-faint); font-size: 13.5px; line-height: 1.6; }

  /* Agents page: a grid of specializations, each one a real system prompt. */
  .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .agent-card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--bg-card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow-card);
  }
  .agent-head { display: flex; align-items: center; gap: 12px; }
  .agent-icon {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    background: var(--accent-wash); border: 1px solid var(--accent-dim);
    display: flex; align-items: center; justify-content: center; color: var(--accent-bright);
  }
  .agent-icon svg { width: 19px; height: 19px; }
  .agent-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
  .agent-role { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }
  .agent-detail { margin: 0; color: var(--text-dim); font-size: 13px; line-height: 1.6; flex: 1; }
  .agent-starters { display: flex; flex-direction: column; gap: 5px; }
  .agent-starters .starters-label { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint); font-weight: 600; margin-bottom: 2px; }
  .agent-starter { font-size: 12px; color: var(--text-dim); padding: 6px 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-sm); }
  .agent-start { align-self: flex-start; }
  .agent-start button { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: var(--on-accent); border: none; border-radius: var(--radius); padding: 9px 15px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .agent-start button:hover { filter: brightness(1.08); }
  .agent-start svg { width: 14px; height: 14px; }

  /* ===================== the project workspace =====================
     Functional scaffolding for the three brief pillars (map / details /
     Main Agent). Layout is deliberately plain: the owner's Figma frames
     reskin it. Data is final — every pixel here reads real store state. */
  .ws-main { padding: 26px 30px 44px; }
  .ws-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; max-width: 1280px; margin: 0 auto; align-items: start; }
  .ws-breadcrumb { font-size: 12.5px; color: var(--text-faint); margin-bottom: 14px; }
  .ws-breadcrumb a { color: var(--accent-bright); text-decoration: none; }
  .ws-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .ws-head-main { min-width: 0; max-width: 640px; }
  .ws-meta { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .ws-source, .ws-updated { font-size: 11.5px; color: var(--text-faint); }
  .ws-desc { margin: 12px 0 0; color: var(--text-dim); font-size: 13.5px; line-height: 1.6; }
  .ws-desc-origin { color: var(--text-faint); font-size: 11.5px; }
  .ws-desc-empty { color: var(--text-faint); font-style: italic; }
  .ws-status { flex-shrink: 0; }
  .ws-status-row { display: flex; gap: 8px; }
  .ws-status-row select { width: auto; min-width: 150px; }
  .ws-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .ws-section-title { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  .ws-section-sub { font-size: 12px; color: var(--text-faint); }

  .ws-map { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 20px; margin-bottom: 22px; }
  .ws-buckets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 640px) { .ws-buckets { grid-template-columns: 1fr; } }
  .ws-bucket { background: var(--bg-sunken); border-radius: var(--radius-sm); padding: 12px; min-height: 74px; }
  .ws-bucket-head { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 9px; }
  .ws-bucket-head .count { opacity: 0.7; }
  .ws-bucket-body { display: flex; flex-direction: column; gap: 8px; }
  .ws-bucket-empty { color: var(--border); font-size: 12px; }
  .ws-task-cell {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--bg-raised); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 9px 11px; text-decoration: none; color: var(--text);
  }
  .ws-task-cell:hover { border-color: var(--accent-dim); }
  .ws-task-cell.active { background: var(--accent-wash); border-color: var(--accent-dim); }
  .ws-task-title { font-size: 12.5px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
  .ws-task-progress { font-size: 10.5px; color: var(--text-faint); white-space: nowrap; flex-shrink: 0; }
  .ws-new-task { display: flex; gap: 10px; }
  .ws-new-task .text-input { flex: 1; }

  .ws-details { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 20px; margin-bottom: 22px; }
  .ws-details-close { font-size: 12px; color: var(--text-faint); text-decoration: none; }
  .ws-details-close:hover { color: var(--text); }
  .ws-details-title { margin: 0 0 8px; font-family: var(--font-display); font-size: 15.5px; }
  .ws-details-request { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin: 0 0 14px; }
  .ws-run-line { font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; }
  .ws-steps { margin: 0 0 12px; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; }
  .ws-step { font-size: 13px; }
  .ws-step.st-done { color: var(--text-faint); text-decoration: line-through; }
  .ws-step.st-active { color: var(--accent-bright); }
  .ws-step-evidence { display: block; color: var(--text-faint); font-size: 11.5px; margin-top: 2px; }
  .ws-activity { border-top: 1px solid var(--border-soft); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .ws-activity-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--text-dim); }
  .ws-activity-time { color: var(--text-faint); flex-shrink: 0; }
  .ws-no-run { color: var(--text-faint); font-size: 13px; }

  .ws-agent {
    display: flex; flex-direction: column; gap: 0; background: var(--bg-card);
    border-radius: var(--radius); box-shadow: var(--shadow-card);
    height: calc(100vh - 70px); position: sticky; top: 26px; overflow: hidden;
  }
  .ws-agent-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--border-soft); }
  .ws-agent-sub { margin: 6px 0 0; color: var(--text-faint); font-size: 12px; line-height: 1.55; }
  .ws-thread { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .ws-thread-empty { text-align: center; margin: auto; padding: 22px 14px; }
  .ws-thread-empty .empty-mark { width: 44px; height: 44px; opacity: 0.9; }
  .ws-thread-empty p { color: var(--text-faint); font-size: 12.5px; line-height: 1.6; margin: 10px 0 14px; }
  .ws-chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .ws-chip {
    background: transparent; border: 1px solid var(--accent-dim); color: var(--accent-bright);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .ws-chip:hover { background: var(--accent-wash); }
  .ws-turn-status { display: flex; align-items: center; gap: 9px; padding: 9px 16px; color: var(--accent-bright); font-size: 12px; border-top: 1px solid var(--border-soft); }
  .ws-turn-status[hidden] { display: none; }
  .ws-turn-mark { width: 16px; height: 16px; animation: orbit-ring-turn 1.6s linear infinite; }
  .ws-followups:empty { display: none; }
  .ws-followups { padding: 8px 16px 4px; justify-content: flex-start; border-top: 1px solid var(--border-soft); }
  .ws-composer { display: flex; gap: 9px; padding: 14px 16px; border-top: 1px solid var(--border-soft); align-items: flex-end; }
  .ws-composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 130px; background: var(--bg-sunken); }
  .ws-composer .btn-primary { padding: 10px 18px; }
  .ws-composer .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .ws-noscript { color: var(--text-faint); font-size: 12px; margin: 6px 0 0; }
  .ws-error { color: var(--red); font-size: 12.5px; margin-top: 6px; }
  .ws-code {
    position: relative; background: var(--bg-sunken); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 12px 14px; margin: 8px 0; overflow-x: auto;
  }
  .ws-code code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; color: var(--text); }
  .ws-code-copy {
    position: absolute; top: 7px; right: 7px; background: var(--bg-raised);
    border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius-sm);
    font: inherit; font-size: 11px; padding: 4px 9px; cursor: pointer; opacity: 0;
    transition: opacity 0.15s ease;
  }
  .ws-code:hover .ws-code-copy, .ws-code-copy:focus-visible { opacity: 1; }
  .ws-thread .chat-row { display: flex; flex-direction: column; gap: 3px; }

  @media (max-width: 1100px) {
    .ws-grid { grid-template-columns: 1fr; }
    .ws-agent { position: static; height: 70vh; }
  }

  .oi { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .sidebar-nav-icon { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; }
  .sidebar-nav-icon svg { width: 15px; height: 15px; }

  @media (max-width: 900px) {
    .page-main { padding: 24px 18px 44px; }
    .page-head { flex-direction: column; align-items: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
<script>
  // Applied before the first paint so a collapsed sidebar never flashes open as
  // the page loads. app.js owns the toggle itself; this only restores the choice.
  (function () {
    try {
      if (window.localStorage.getItem("orbit.sidebar.collapsed") === "1") {
        document.documentElement.classList.add("sidebar-collapsed-pending");
      }
    } catch (_error) {
      // Private mode or a blocked store: the sidebar simply starts expanded.
    }
  })();
</script>
<style>
  /* The same rule the sidebar class carries, applied on the root before the
     sidebar element exists; app.js swaps it for the real class. */
  html.sidebar-collapsed-pending .sidebar { width: 58px; padding: 12px 7px; }
  html.sidebar-collapsed-pending .sidebar .sidebar-label,
  html.sidebar-collapsed-pending .sidebar .sidebar-search input,
  html.sidebar-collapsed-pending .sidebar .history-group h4,
  html.sidebar-collapsed-pending .sidebar .connected-apps-row .label-text,
  html.sidebar-collapsed-pending .sidebar .user-row .names,
  html.sidebar-collapsed-pending .sidebar .sidebar-brand .brand-word { display: none; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
